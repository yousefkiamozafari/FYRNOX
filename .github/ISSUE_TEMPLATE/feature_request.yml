name: Feature Request / پیشنهاد قابلیت جدید
description: Suggest an idea or enhancement for FYRNOX
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas to make FYRNOX faster, lighter, and more reliable!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation / دلیل و انگیزه پیشنهاد
      description: Is your feature request related to a problem or limitation?
      placeholder: "e.g. I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / راهکار پیشنهادی
      description: Describe what you would like to see added or changed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered / گزینه‌های دیگر
      description: Any alternative solutions or workarounds you've considered?
